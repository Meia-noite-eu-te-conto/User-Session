name: image

# Constrói a imagem, roda um smoke test e um teste de carga com k6, e só então
# publica. Ordem importa: imagem que não passa `manage.py check` ou que não
# aguenta a carga do k6 não chega ao registry.
#
# Requer o secret GHCR_TOKEN — PAT clássico com escopo write:packages, definido como
# secret da ORGANIZAÇÃO (Settings → Secrets and variables → Actions) para os três
# repositórios compartilharem um só.
#
# Por que não o GITHUB_TOKEN automático: ele só publica pacotes do dono do
# repositório, ou seja em ghcr.io/meia-noite-eu-te-conto/*. As imagens vão para
# ghcr.io/davypaulino/*, que é o namespace que o cluster já usa e para o qual o pull
# secret `github-registry` já funciona.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/davypaulino/pong-user-session

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Postgres e Redis reais para o teste de carga do k6 rodar contra o
    # comportamento de verdade do serviço — não uma versão dublada.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usersession
          POSTGRES_PASSWORD: usersession
          POSTGRES_DB: usersession
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # {{raw}} preserva o "v" do tag git (v0.1.0), que é a forma usada nos
          # manifests e pelo routine-api. {{version}} sozinho geraria 0.1.0 e a
          # imagem não seria encontrada.
          # Sem `latest`: com imagePullPolicy IfNotPresent, uma tag móvel faz o nó
          # rodar imagem em cache sem avisar.
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      # Constrói para o daemon local, sem publicar, para poder testar.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: |
          set -euo pipefail
          # roda como non-root?
          uid=$(docker run --rm ${{ env.IMAGE }}:ci id -u)
          test "$uid" = "10001" || { echo "esperado uid 10001, obtido $uid"; exit 1; }
          # configuração do Django é válida? (não precisa de banco)
          docker run --rm ${{ env.IMAGE }}:ci python manage.py check
          # as dependências nativas carregam?
          docker run --rm ${{ env.IMAGE }}:ci python -c "import django, psycopg2, channels, uvicorn"

      # Migra e sobe o serviço de verdade (Postgres e Redis reais, via
      # services: do job) para o k6 rodar contra a coisa real, não um mock.
      # Segredos são só desta execução de CI, gerados aqui, nunca reais.
      - name: migrations para o teste de carga
        env:
          APP_ENV: |
            DB_NAME=usersession
            DB_USER=usersession
            DB_PASSWORD=usersession
            DB_HOST=localhost
            DB_PORT=5432
            REDIS_HOST=localhost
            REDIS_PORT=6379
            SECRET_KEY=ci-only-secret-nao-e-real
            JWT_SIGNING_KEY=ci-only-jwt-nao-e-real
        run: |
          echo "$APP_ENV" > /tmp/app.env
          docker run --rm --network host --env-file /tmp/app.env \
            ${{ env.IMAGE }}:ci python manage.py migrate --noinput

      - name: sobe o serviço para o teste de carga
        run: |
          docker run -d --name app-under-test --network host --env-file /tmp/app.env \
            ${{ env.IMAGE }}:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8002/api/v1/user-session/rooms/ >/dev/null && exit 0
            sleep 1
          done
          echo "serviço não respondeu a tempo"
          docker logs app-under-test
          exit 1

      # docker run direto com a imagem oficial, não a Action grafana/k6-action:
      # ela foi ARQUIVADA (movida para grafana-cold-storage/k6-action) e não
      # recebe mais atualização. É também exatamente o comando validado à mão
      # antes deste workflow existir — mesmo caminho, sem tradução.
      - name: k6 — teste de carga (k6/smoke.js)
        run: |
          docker run --rm --network host \
            -v "$PWD/k6:/scripts:ro" \
            -e BASE_URL=http://localhost:8002 \
            docker.io/grafana/k6:2.2.0 run /scripts/smoke.js

      - name: logs do serviço sob teste (só se algo falhou)
        if: failure()
        run: docker logs app-under-test

      - name: encerra o serviço de teste
        if: always()
        run: docker rm -f app-under-test || true

      - name: login no ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: davypaulino
          password: ${{ secrets.GHCR_TOKEN }}

      # Publica reaproveitando o cache do build acima — rápido.
      - name: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
